#############################################################
# OpenVPN Server Configuration - Node 0 (Public Cloud: Azure)
#############################################################

# --- Basic Connectivity ---
port 1194
proto udp
dev tap # Layer 2 Ethernet bridging
mode server
tls-server
# --- Certificates & Keys (PKI) ---
ca /etc/openvpn/ca.crt
cert /etc/openvpn/server.crt
key /etc/openvpn/server.key
dh /etc/openvpn/dh.pem
tls-auth /etc/openvpn/ta.key 0
# --- Encryption & Security ---
cipher AES-256-GCM
auth SHA256
user nobody
group nogroup
# --- Persistence & Logging ---
persist-key
persist-tun
status openvpn-status.log
verb 3