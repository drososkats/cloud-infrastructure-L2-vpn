##################################################################
# OpenVPN Client Configuration - Node 2 (Local Management Station)
##################################################################

client
dev tap0 # Layer 2 Ethernet bridging (matches server and Node 1)
proto udp
remote 51.11.240.65 1194
resolv-retry infinite
nobind
persist-key
persist-tun

# PKI Certificates and Keys
# Note: Ensure these files are in the same directory as this config
ca ca.crt
cert node2.crt
key node2.key
tls-auth ta.key 1

# Security and Data Integrity
remote-cert-tls server # Verify that the peer certificate is a server
cipher AES-256-GCM
auth SHA256
verb 3