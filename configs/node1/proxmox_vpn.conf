#####################################################################
# OpenVPN Client Configuration - Node 1 (Private Cloud: Proxmox Host)
#####################################################################

# --- Basic Connectivity ---
client
dev tap  # Layer 2 Ethernet bridging (matches server config)
proto udp
remote 51.11.240.65 1194
resolv-retry infinite
nobind
persist-key
persist-tun

# --- PKI Certificates and Keys ---
ca /etc/openvpn/client/ca.crt
cert /etc/openvpn/client/proxmox-host.crt
key /etc/openvpn/client/proxmox-host.key
tls-auth /etc/openvpn/client/ta.key 1

# --- Security and Data Integrity ---
remote-cert-tls server # Verify that the peer certificate is a server
cipher AES-256-GCM
auth SHA256
verb 3

# --- Routing and Policy ---
route-nopull  # Do not accept routes pushed by the server
pull-filter ignore "dhcp-option DNS" # Prevent server from overriding local DNS